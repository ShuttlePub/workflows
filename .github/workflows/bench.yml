name: Check
on:
  workflow_call:
    inputs:
      features:
        type: string
        required: false
        default: "async,tokio-support"
      compare-branch:
        type: string
        required: false
        default: main
permissions:
  contents: read
jobs:
  read-toolchain:
    uses: ./.github/workflows/read-toolchain.yml
  detect-workspaces:
    uses: ./.github/workflows/detect-workspaces.yml
  check:
    name: Bench ${{ matrix.workspace }}
    needs: [read-toolchain, detect-workspaces]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJson(needs.detect-workspaces.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: ${{ needs.read-toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.workspace }}
      - name: Bench
        uses: boa-dev/criterion-compare-action@adfd3a94634fe2041ce5613eb7df09d247555b87 # v3.2.4
        with:
          branchName: ${{ inputs.compare-branch }}
          package: ${{ matrix.workspace }}
          features: ${{ inputs.features }}
